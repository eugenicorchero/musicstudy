<!DOCTYPE html>
<html lang="ca" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Music Study Protocol</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg-main: #0d1117;
            --bg-card: rgba(22, 27, 34, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-main);
            color: #f0f6fc;
            font-family: 'Inter', sans-serif;
            height: 100dvh;
            overflow: hidden; /* Evita qualsevol scroll vertical en telèfons allargats */
        }

        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
        }

        .font-mono-custom {
            font-family: 'JetBrains Mono', monospace;
        }

        .interactive-element {
            transition: transform 0.15s ease;
            touch-action: manipulation;
        }

        .interactive-element:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body class="flex flex-col justify-between h-full p-0 m-0 selection:bg-cyan-500">

    <!-- HEADER MINIMALISTA -->
    <header class="px-4 py-2 sm:py-3 flex items-center justify-between border-b border-white/10 shrink-0">
        <div class="flex items-center space-x-2">
            <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-cyan-500 flex items-center justify-center text-black font-bold">
                <i class="fas fa-music text-xs"></i>
            </div>
            <h1 class="font-bold text-xs sm:text-base">Music Protocol</h1>
        </div>

        <div class="flex items-center gap-2">
            <!-- Botó per mostrar/amagar detalls en mòbil -->
            <button onclick="toggleDetails()" class="sm:hidden text-xs text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-2 py-1 rounded-lg">
                <i class="fas fa-info-circle"></i> Info
            </button>
            <div class="flex items-center space-x-1.5 bg-white/5 px-2.5 py-1 rounded-lg border border-white/10 text-xs font-mono-custom">
                <i class="fas fa-stopwatch text-cyan-400 text-xs"></i>
                <span id="total-time">00:00:00</span>
            </div>
        </div>
    </header>

    <!-- MAIN (COMPACTE I SENSE OVERFLOW) -->
    <main class="flex-grow flex flex-col items-center justify-evenly px-4 py-2 max-w-md mx-auto w-full">

        <!-- FASE ACTUAL (TITOL PREDOMINANT) -->
        <div class="text-center w-full">
            <span id="phase-badge" class="inline-block px-2.5 py-0.5 rounded-full text-[10px] font-semibold uppercase tracking-wider bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 mb-1">
                Fase I.1
            </span>
            <h2 id="phase-title" class="text-lg sm:text-2xl font-bold text-white tracking-tight leading-tight">
                Preparació i So Fonamental
            </h2>

            <!-- DESCRIPCIÓ COMPACTABLE EN MÒBIL -->
            <div id="details-panel" class="hidden sm:block mt-2">
                <p id="phase-desc" class="text-gray-400 text-xs leading-relaxed mb-2">
                    Estiraments lleugers i concentració. Toca notes llargues per centrar el teu so.
                </p>
                <div class="inline-flex items-center gap-1.5 text-[10px] font-mono-custom text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded border border-emerald-500/20">
                    <i class="fas fa-tachometer-alt"></i>
                    <span id="bpm-text">No s'usa metrònom</span>
                </div>
            </div>
        </div>

        <!-- TIMER ESCALAT DE MANERA OPTIMITZADA -->
        <div class="relative w-44 sm:w-60 aspect-square flex items-center justify-center my-1">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="52" class="stroke-white/5" stroke-width="6" fill="transparent" />
                <circle id="timer-progress" cx="60" cy="60" r="52" class="stroke-cyan-400 transition-all duration-300" stroke-width="6" stroke-dasharray="326.72" stroke-dashoffset="0" stroke-linecap="round" fill="transparent" />
            </svg>
            <div class="absolute flex flex-col items-center justify-center text-center">
                <span id="timer-display" class="text-3xl sm:text-5xl font-bold font-mono-custom text-white tracking-tighter">05:00</span>
                <span id="timer-state" class="text-[9px] uppercase tracking-widest text-gray-400">Pausat</span>
            </div>
        </div>

        <!-- CONTROLS PRINCIPALS -->
        <div class="flex items-center justify-center gap-3">
            <button id="btn-prev" aria-label="Anterior" class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl glass-panel text-gray-300 flex items-center justify-center interactive-element">
                <i class="fas fa-backward text-sm"></i>
            </button>
            <button id="btn-play" aria-label="Play" class="w-12 h-12 sm:w-16 sm:h-16 rounded-2xl bg-cyan-500 text-black font-bold text-lg sm:text-2xl flex items-center justify-center shadow-lg shadow-cyan-500/25 interactive-element">
                <i id="play-icon" class="fas fa-play ml-0.5"></i>
            </button>
            <button id="btn-next" aria-label="Següent" class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl glass-panel text-gray-300 flex items-center justify-center interactive-element">
                <i class="fas fa-forward text-sm"></i>
            </button>
        </div>

    </main>

    <!-- NAVEGACIÓ INFERIOR COMPACTA (SELECTOR EN LLOC DE CARRUSEL EN MÒBIL) -->
    <footer class="glass-panel border-t border-white/10 p-3 shrink-0">
        <div class="max-w-md mx-auto flex items-center justify-between gap-2">
            <span class="text-[10px] uppercase font-bold text-gray-400 shrink-0">Fase:</span>
            <select id="phase-select" onchange="loadPhase(parseInt(this.value))" class="bg-white/10 text-white text-xs rounded-lg p-2 border border-white/10 w-full focus:outline-none focus:border-cyan-400">
                <!-- S'omple amb JS -->
            </select>
        </div>
    </footer>

    <!-- LOGIC SCRIPT -->
    <script>
        const phases = [
            { id: "I.1", group: "I. Escalfament", name: "Preparació i So Fonamental", time: 5 * 60, desc: "Estiraments lleugers i concentració. Toca notes llargues per centrar el teu so.", bpm: "Sense metrònom" },
            { id: "I.2", group: "I. Escalfament", name: "Tècnica Diària (Escales)", time: 15 * 60, desc: "Practica la tècnica amb uniformitat i precisió.", bpm: "60-80 → Obj: 100-120 bpm" },
            { id: "II.1", group: "II. Repertori", name: "Peça de Repàs / Fluïdesa", time: 10 * 60, desc: "Toca una peça coneguda per guanyar confiança.", bpm: "Tempo de la partitura" },
            { id: "II.2", group: "II. Repertori", name: "El Repte (Passatges Difícils)", time: 25 * 60, desc: "Practica lenta i concentrada. Aïlla els errors.", bpm: "40-60 bpm (gradual)" },
            { id: "II.3", group: "II. Repertori", name: "Simulació", time: 5 * 60, desc: "Toca sense aturar-te. Simula una actuació.", bpm: "80% - 100% tempo real" },
            { id: "III.1", group: "III. Desenvolupament", name: "Lectura a Vista / Oïda", time: 10 * 60, desc: "Lectura de peces fàcils o transcripció.", bpm: "Tempo lent" },
            { id: "III.2", group: "III. Desenvolupament", name: "Avaluació i Registre", time: 5 * 60, desc: "Apunta progressos i objectius.", bpm: "Sense metrònom" }
        ];

        let currentIndex = 0;
        let timeRemaining = phases[0].time;
        let timerInterval = null;
        let isRunning = false;
        let totalSeconds = 0;

        const phaseBadge = document.getElementById('phase-badge');
        const phaseTitle = document.getElementById('phase-title');
        const phaseDesc = document.getElementById('phase-desc');
        const bpmText = document.getElementById('bpm-text');
        const timerDisplay = document.getElementById('timer-display');
        const timerState = document.getElementById('timer-state');
        const playBtn = document.getElementById('btn-play');
        const playIcon = document.getElementById('play-icon');
        const phaseSelect = document.getElementById('phase-select');

        function init() {
            // Omplir desplegable
            phaseSelect.innerHTML = phases.map((p, i) => `<option value="${i}">${p.id} - ${p.name}</option>`).join('');
            loadPhase(0);
            setInterval(() => {
                if (isRunning) {
                    totalSeconds++;
                    const h = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
                    const m = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
                    const s = (totalSeconds % 60).toString().padStart(2, '0');
                    document.getElementById('total-time').innerText = `${h}:${m}:${s}`;
                }
            }, 1000);
        }

        function loadPhase(index) {
            currentIndex = index;
            phaseSelect.value = index;
            const p = phases[index];
            timeRemaining = p.time;

            phaseBadge.innerText = `${p.id} • ${p.group}`;
            phaseTitle.innerText = p.name;
            phaseDesc.innerText = p.desc;
            bpmText.innerText = p.bpm;

            updateTimer();
            if (isRunning) pause();
        }

        function updateTimer() {
            const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const s = (timeRemaining % 60).toString().padStart(2, '0');
            timerDisplay.innerText = `${m}:${s}`;

            const total = phases[currentIndex].time;
            const offset = 326.72 - (timeRemaining / total) * 326.72;
            document.getElementById('timer-progress').style.strokeDashoffset = offset;
        }

        function toggleTimer() {
            isRunning ? pause() : start();
        }

        function start() {
            isRunning = true;
            timerState.innerText = "En progrés";
            playIcon.className = "fas fa-pause";
            timerInterval = setInterval(() => {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    updateTimer();
                } else {
                    pause();
                    if (currentIndex < phases.length - 1) loadPhase(currentIndex + 1);
                }
            }, 1000);
        }

        function pause() {
            isRunning = false;
            timerState.innerText = "Pausat";
            playIcon.className = "fas fa-play ml-0.5";
            clearInterval(timerInterval);
        }

        function toggleDetails() {
            const panel = document.getElementById('details-panel');
            panel.classList.toggle('hidden');
        }

        playBtn.onclick = toggleTimer;
        document.getElementById('btn-prev').onclick = () => { if (currentIndex > 0) loadPhase(currentIndex - 1); };
        document.getElementById('btn-next').onclick = () => { if (currentIndex < phases.length - 1) loadPhase(currentIndex + 1); };

        window.onload = init;
    </script>
</body>

</html>
